<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Card Tactics 2.0｜莉維亞 2D 角色 × 原版 3D 戰場（隔離測試）</title>
<link rel="stylesheet" href="../css/app.css" />
<link rel="stylesheet" href="../css/unit-hud.css" />
<link rel="stylesheet" href="../css/unit-inspector.css" />
<link rel="stylesheet" href="../css/item-ui.css" />
<link rel="stylesheet" href="./lab.css" />
</head>
<body>
  <!-- This subtree is taken from the original Card Tactics 2.0 #battleScreen.
       The original stylesheet and renderer are loaded read-only from ../ . -->
  <section id="battleScreen" class="game-screen battle-screen active">
    <canvas id="battleCanvas" touch-action="none"></canvas>
    <div id="battleViewControls" class="battle-view-controls"><button id="battleBack" type="button">← 主選單</button><button id="rotateLeft" type="button" title="逆時針旋轉">↺</button><button id="projectionToggle" type="button">正視圖</button><button id="rotateRight" type="button" title="順時針旋轉">↻</button><button id="resetView" type="button" title="重置視角">⌂</button></div>
    <button id="resetMap" class="reset-battle" type="button">重置戰場</button><div id="turnStatus" class="turn-status">載入原版 Babylon 3D 戰場...</div>
    <div id="versusCoreHud" class="versus-core-hud" aria-hidden="false"><div class="versus-core-row"><div class="versus-core-side player"><div><strong>我方 CORE</strong><span id="playerCoreHp">—</span></div><div class="core-track"><i id="playerCoreBar"></i></div></div><div class="versus-core-side enemy"><div><strong>敵方 CORE</strong><span id="enemyCoreHp">—</span></div><div class="core-track"><i id="enemyCoreBar"></i></div></div></div><div id="captureSummary" class="capture-summary"></div></div>
    <section id="cardPhasePanel" class="card-phase-panel"></section><section id="skillBar" class="skillbar"></section>
    <div class="battle-right-rail"><button id="weatherIndicator" type="button" tabindex="-1" aria-disabled="true" title="目前天氣">☀ 晴朗</button><button id="mapToggle" type="button" title="地圖資訊">MAP</button><button id="logToggle" type="button">LOG</button><button id="nextUnit" type="button" title="選取莉維亞">下一角色</button><button id="endTurn" type="button">結束回合</button></div>
    <aside id="battleContextInspector" class="battle-context-inspector" aria-hidden="true"><header><strong>戰場詳情</strong><button id="contextClose" type="button">×</button></header><div class="battle-context-tabs"><button id="contextUnitTab" type="button">角色</button><button id="contextTileTab" type="button">地形</button></div><section id="contextUnitPanel" class="battle-context-panel"><div id="contextHudSlot" class="context-hud-slot" aria-label="角色頭像、血量、法力、裝備與狀態"></div><div class="context-section-title">基礎數值</div><div id="contextUnitStats" class="context-grid"></div><div id="contextUnitPosition" class="context-line"></div></section><section id="contextTilePanel" class="battle-context-panel"><strong id="contextTileTitle">—</strong><div id="contextTileMeta" class="context-line"></div><div id="contextTileStatus" class="context-line"></div><pre id="contextTileDetails" class="context-pre"></pre></section></aside>
    <aside id="mapInfoShell" class="map-info-shell" aria-hidden="true"><header><strong>地圖資訊</strong><button id="mapClose" type="button">×</button></header><div id="mapMeta" class="map-meta"></div><div id="mapStageInfo" class="map-stage-info"></div></aside>
    <aside id="battleLogShell" class="battle-log-shell"><header><strong>Battle Log</strong><button id="logClose" type="button">×</button></header><div id="battleLogTabs" class="battle-log-tabs" role="tablist" aria-label="戰鬥紀錄分類"><button type="button" data-log-type="BATTLE">戰鬥</button><button type="button" data-log-type="SYSTEM">系統</button><button type="button" data-log-type="DETAIL">詳細</button></div><div id="battleLog" class="battle-log"></div></aside>
  </section>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
<script type="module" src="./hybrid-demo.js"></script>
</body>
</html>

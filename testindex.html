<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Card Tactics 2.0｜Test Lab</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071018}
    #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#071018;color:#dbe8f4;font-weight:800;letter-spacing:.04em}
    #boot.hidden{display:none}
  </style>
</head>
<body>
  <iframe id="game" src="./index.html" title="Card Tactics Test Lab"></iframe>
  <div id="boot">載入 Card Tactics Test Lab...</div>
  <script type="module">
    const {TILE_SIZE,ELEVATION_HEIGHT}=await import("./js/coordinate-system.js");
    const frame=document.getElementById("game"),boot=document.getElementById("boot");
    let markerRaf=0,refreshing=false,currentSeed=null,latestHydrologyLog=null;

    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const waitFor=async test=>{
      for(let i=0;i<900;i++){
        const value=test();
        if(value)return value;
        await sleep(20);
      }
      throw new Error("Card Tactics Runtime 載入逾時");
    };

    function injectTestStyle(doc){
      if(doc.getElementById("cardTacticsTestLabStyle"))return;
      const style=doc.createElement("style");
      style.id="cardTacticsTestLabStyle";
      style.textContent=`
        body.card-tactics-test-mode #cardPhasePanel,
        body.card-tactics-test-mode #skillBar,
        body.card-tactics-test-mode #versusCoreHud,
        body.card-tactics-test-mode #turnStatus,
        body.card-tactics-test-mode #resetMap,
        body.card-tactics-test-mode .opponent-hand,
        body.card-tactics-test-mode .opponent-meta,
        body.card-tactics-test-mode .opponent-message,
        body.card-tactics-test-mode .battle-right-rail{display:none!important}
        body.card-tactics-test-mode #battleBack{display:none!important}
        body.card-tactics-test-mode .battle-view-controls{top:10px!important;right:8px!important}
        .test-lab-toolbar{position:absolute;z-index:180;left:8px;top:8px;display:flex;align-items:flex-start;gap:7px;max-width:calc(100vw - 230px);padding:7px 8px;border:1px solid #73859a;border-radius:10px;background:#07111be8;box-shadow:0 8px 28px #0009;pointer-events:auto}
        .test-lab-toolbar button,.test-lab-toolbar input,.test-lab-toolbar select{min-height:36px;padding:6px 9px;border:1px solid #73859a;border-radius:8px;background:#182332;color:#fff;font-weight:800}
        .test-lab-toolbar button{border-color:#d2b96f;white-space:nowrap}
        .test-lab-toolbar select{font-size:11px;min-height:36px;padding:6px;background:#182332;color:#fff;border:1px solid #73859a;border-radius:8px}
        .test-lab-toolbar button:disabled{opacity:.5}
        .test-lab-seed{width:118px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
        .test-lab-info{font-size:10px;line-height:1.35;color:#d6e1ec;white-space:normal}
        .test-lab-title{font-weight:900;color:#fff0c5;margin-bottom:2px}
        .test-lab-legend{display:flex;gap:7px;align-items:center;margin-top:3px;font-size:9px;color:#c9d5df;white-space:nowrap}
        .test-lab-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
        .water-inspect-panel{position:absolute;z-index:190;left:8px;bottom:70px;width:min(510px,calc(100vw - 16px));max-height:56vh;display:none;flex-direction:column;border:1px solid #91a3bb;border-radius:10px;background:#07111bf5;box-shadow:0 6px 30px #000b;pointer-events:auto;color:#e2eef9}
        .water-inspect-panel.open{display:flex}
        .water-inspect-panel header{display:flex;align-items:center;gap:7px;padding:7px;border-bottom:1px solid #586b80}
        .water-inspect-panel header strong{flex:1;font-size:12px}
        .water-inspect-panel button{padding:5px 8px;min-height:30px;border:1px solid #8ca1bb;border-radius:6px;background:#182332;color:#fff}
        .water-inspect-panel pre{margin:0;padding:9px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:10px/1.5 ui-monospace,monospace;user-select:text;-webkit-user-select:text}
        .test-lab-toolbar button.inspection-on{background:#175a57;border-color:#61e7d1}
        .hydrology-test-marker-layer{position:absolute;z-index:170;inset:0;pointer-events:none;overflow:hidden}
        .hydrology-test-marker{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 6px;border:1px solid #fff8;border-radius:7px;background:#07111be8;box-shadow:0 3px 14px #000a;color:#fff;font-size:9px;font-weight:900;line-height:1.15;white-space:nowrap;text-shadow:0 1px 2px #000}
        .hydrology-test-marker:after{content:"";position:absolute;left:50%;top:100%;height:18px;border-left:2px solid currentColor;opacity:.8}
        .hydrology-test-marker.entry{color:#ffd768;border-color:#ffd768aa}
        .hydrology-test-marker.spring{color:#65e6ff;border-color:#65e6ffaa}
        .hydrology-test-marker.outlet{color:#ff7d7d;border-color:#ff7d7daa}
        .hydrology-test-marker.source{color:#d7a0ff;border-color:#d7a0ffaa}
        @media(max-width:700px){
          .test-lab-toolbar{max-width:calc(100vw - 150px);padding:5px 6px;gap:4px;flex-wrap:wrap}
          .test-lab-toolbar button,.test-lab-toolbar input,.test-lab-toolbar select{font-size:9px;padding:5px 7px;min-height:30px}
          .test-lab-seed{width:100px}.test-lab-info{font-size:8px}.test-lab-legend{display:none}
          body.card-tactics-test-mode .battle-view-controls{top:82px!important}
          .hydrology-test-marker{font-size:8px;padding:3px 5px}
        }
      `;
      doc.head.appendChild(style);
    }

    function showBattle(doc,win){
      doc.body.classList.add("card-tactics-test-mode");
      doc.querySelectorAll(".game-screen").forEach(node=>node.classList.toggle("active",node.id==="battleScreen"));
      win.CardTacticsRenderer?.resize?.();
      win.CardTacticsRenderer?.resetView?.();
      win.dispatchEvent(new win.CustomEvent("cardtactics:battle-screen-enter"));
      win.dispatchEvent(new win.CustomEvent("cardtactics:battle-render"));
    }

    function markerRecords(runtime){
      const map=runtime.getBattleMap?.();
      const records=[];
      for(const tile of map?.tiles||[]){
        if(tile?.hydrologySource===true&&tile?.hydrologySourceDisabled!==true){
          const kind=String(tile.sourceKind||"").toUpperCase();
          if(kind==="OFF_MAP_SOURCE")records.push({kind:"entry",label:"入口／水源",tile});
          else if(kind==="SPRING_SOURCE")records.push({kind:"spring",label:"泉眼／水源",tile});
          else records.push({kind:"source",label:"水源",tile});
        }
        if(tile?.hydrologyDrain===true||tile?.drain===true)records.push({kind:"outlet",label:"出口",tile});
      }
      return records;
    }

    function ensureOverlay(doc){
      const battle=doc.getElementById("battleScreen");
      let toolbar=doc.getElementById("testLabToolbar");
      if(!toolbar){
        toolbar=doc.createElement("div");toolbar.id="testLabToolbar";toolbar.className="test-lab-toolbar";
        toolbar.innerHTML=`
          <button id="testLabRefresh" type="button">刷新地圖</button>
          <input id="testLabSeed" class="test-lab-seed" inputmode="numeric" aria-label="地圖 Seed" placeholder="Seed" />
          <button id="testLabRebuild" type="button">重建 Seed</button>
          <label style="font-size:10px;color:#e2eef9">泉眼 <select id="testLabSpring" aria-label="泉眼生成模式"><option value="ALWAYS" selected>強制產生</option><option value="RANDOM">自然機率</option><option value="NEVER">不產生</option></select></label>
          <button id="testLabInspect" type="button" class="inspection-on" aria-pressed="true">點選診斷：開</button>
          <div>
            <div class="test-lab-title">TEST LAB｜水文</div>
            <div id="testLabInfo" class="test-lab-info">XLARGE 32×22｜等待生成</div>
            <div class="test-lab-legend"><span><i style="background:#ffd768"></i>入口</span><span><i style="background:#65e6ff"></i>泉眼</span><span><i style="background:#ff7d7d"></i>出口</span></div>
          </div>`;
        battle.appendChild(toolbar);
      }
      let layer=doc.getElementById("hydrologyTestMarkers");
      if(!layer){layer=doc.createElement("div");layer.id="hydrologyTestMarkers";layer.className="hydrology-test-marker-layer";battle.appendChild(layer);}
      let panel=doc.getElementById("waterInspectPanel");
      if(!panel){
        panel=doc.createElement("section");panel.id="waterInspectPanel";panel.className="water-inspect-panel";
        panel.innerHTML=`<header><strong>水文點選 LOG</strong><button id="testLabCopyLog" type="button">複製 LOG</button><button id="testLabCloseLog" type="button">關閉</button></header><pre id="testLabLogText">點水膜或瀑布，查看水文與幾何資訊。</pre>`;
        battle.appendChild(panel);
      }
      return{
        toolbar,layer,panel,
        spring:doc.getElementById("testLabSpring"),
        inspect:doc.getElementById("testLabInspect"),
        refresh:doc.getElementById("testLabRefresh"),
        rebuild:doc.getElementById("testLabRebuild"),
        seed:doc.getElementById("testLabSeed"),
        info:doc.getElementById("testLabInfo")
      };
    }

    function globalThisHydrologyCapacity(tile){
      const win=frame.contentWindow;
      return Number(win?.HydrologyEngine?.soilCapacity?.(tile)??0);
    }

    function rebuildMarkers(doc,runtime){
      const {layer}=ensureOverlay(doc);layer.replaceChildren();
      for(const record of markerRecords(runtime)){
        const node=doc.createElement("div");node.className=`hydrology-test-marker ${record.kind}`;
        const qIn=Math.max(0,Number(record.tile.hydrologySourceInflow??record.tile.hydrologyRequestedSourceInflow??record.tile.discharge??0));
        const qOut=Object.values(record.tile.hydrologyEdgeDischarge||{}).reduce((sum,edge)=>sum+Math.max(0,Number(edge?.rate||0)),0);
        const depth=Math.max(0,Number(record.tile.waterDepth||0));
        const soil=Math.max(0,Number(record.tile.soilMoisture||0)),soilCap=Math.max(0,Number(globalThisHydrologyCapacity(record.tile)??0));
        node.textContent=`${record.label} (${record.tile.x},${record.tile.y})${record.kind==="entry"||record.kind==="spring"?` Qin ${qIn.toFixed(2)}｜Qout ${qOut.toFixed(2)}｜D ${depth.toFixed(2)}｜Soil ${soil.toFixed(2)}/${soilCap.toFixed(2)}`:""}`;
        node.dataset.x=String(record.tile.x);node.dataset.y=String(record.tile.y);layer.appendChild(node);
      }
    }

    function updateMarkerFrame(win,doc,runtime){
      const renderer=win.CardTacticsRenderer,camera=renderer?.camera?.camera,scene=renderer?.scene,engine=renderer?.engine,canvas=renderer?.canvas;
      const layer=doc.getElementById("hydrologyTestMarkers");
      if(!renderer||!camera||!scene||!engine||!canvas||!layer)return;
      const map=runtime.getBattleMap?.(),byKey=new Map((map?.tiles||[]).map(tile=>[`${tile.x},${tile.y}`,tile]));
      const renderWidth=Math.max(1,engine.getRenderWidth()),renderHeight=Math.max(1,engine.getRenderHeight());
      const viewport=camera.viewport.toGlobal(renderWidth,renderHeight),transform=scene.getTransformMatrix();
      const canvasRect=canvas.getBoundingClientRect(),rootRect=layer.getBoundingClientRect();
      const scaleX=canvasRect.width/renderWidth,scaleY=canvasRect.height/renderHeight,offsetX=canvasRect.left-rootRect.left,offsetY=canvasRect.top-rootRect.top;
      for(const node of layer.children){
        const tile=byKey.get(`${node.dataset.x},${node.dataset.y}`);if(!tile){node.hidden=true;continue;}
        const surface=Math.max(Number(tile.elevation||0),Number(tile.elevation||0)+Math.max(0,Number(tile.waterDepth||0)));
        const world=new win.BABYLON.Vector3(Number(tile.x)*TILE_SIZE,surface*ELEVATION_HEIGHT+.62,Number(tile.y)*TILE_SIZE);
        const p=win.BABYLON.Vector3.Project(world,win.BABYLON.Matrix.Identity(),transform,viewport),x=offsetX+p.x*scaleX,y=offsetY+p.y*scaleY;
        const visible=p.z>=0&&p.z<=1&&x>-120&&x<rootRect.width+120&&y>-80&&y<rootRect.height+80;
        node.hidden=!visible;if(!visible)continue;node.style.left=`${x}px`;node.style.top=`${y}px`;
      }
    }

    function startMarkerLoop(win,doc,runtime){
      cancelAnimationFrame(markerRaf);
      const tick=()=>{updateMarkerFrame(win,doc,runtime);markerRaf=requestAnimationFrame(tick);};tick();
    }

    function normalizeSeed(value){
      const parsed=Number(value);
      return Number.isFinite(parsed)?(parsed>>>0):null;
    }

    async function generateTestMap(win,doc,{reuseSeed=false}={}){
      if(refreshing)return;refreshing=true;
      const runtime=win.CardTacticsRuntime,{refresh,rebuild,seed:seedInput,info,spring}=ensureOverlay(doc);
      refresh.disabled=true;rebuild.disabled=true;
      const requested=reuseSeed?normalizeSeed(seedInput.value):null;
      const seed=requested??win.MapGenerator.randomSeed();
      currentSeed=seed;seedInput.value=String(seed);
      const started=performance.now();
      info.textContent=`XLARGE 32×22｜Seed ${seed}｜生成中…`;
      try{
        // One map per seed, using the existing natural candidate rules.
        // ALWAYS bypasses only the probability gate, not terrain constraints.
        win.CardTacticsBattleSetup={stageId:"versus_core_battle",mapSize:"XLARGE",seed,hydrologyTest:true,springMode:spring.value};
        runtime.resetBattle();
        runtime.debug?.setWeather?.("CLEAR",999);
        runtime.debug?.setWind?.("CALM",0);
        showBattle(doc,win);
        await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
        rebuildMarkers(doc,runtime);
        const records=markerRecords(runtime),entries=records.filter(r=>r.kind==="entry").length,springs=records.filter(r=>r.kind==="spring").length,outlets=records.filter(r=>r.kind==="outlet").length;
        const elapsed=Math.round(performance.now()-started);
        info.textContent=`XLARGE 32×22｜Seed ${seed}｜泉眼模式 ${spring.options[spring.selectedIndex].text}｜入口 ${entries}｜泉眼 ${springs}｜出口 ${outlets}｜${elapsed} ms${spring.value==="ALWAYS"&&!springs?"｜此 Seed 無符合原生規則的泉眼位置":""}`;
      }catch(error){
        console.error(error);
        const elapsed=Math.round(performance.now()-started);
        info.textContent=`生成失敗｜Seed ${seed}｜${elapsed} ms｜${error?.message||error}`;
      }finally{
        refresh.disabled=false;rebuild.disabled=false;refreshing=false;
      }
    }

    // The test page reads the live Renderer and Hydrology; it never mutates game state.
    function tileSnapshot(tile,hydrology){
      if(!tile)return null;
      const flux=field=>Object.fromEntries(Object.entries(tile[field]||{}).map(([dir,record])=>[dir,{
        rate:record?.rate??null,volume:record?.volume??null,transportVolume:record?.transportVolume??null,
        fromSurface:record?.fromSurface??null,toSurface:record?.toSurface??null
      }]));
      return{x:tile.x,y:tile.y,terrain:tile.terrain,elevation:tile.elevation,
        waterDepth:tile.waterDepth,waterSurfaceZ:tile.waterSurfaceZ,
        soilMoisture:tile.soilMoisture,soilCapacity:hydrology?.soilCapacity?.(tile)??null,
        hydrologySource:tile.hydrologySource===true,hydrologySourceDisabled:tile.hydrologySourceDisabled===true,
        sourceKind:tile.sourceKind??null,hydrologySourceInflow:tile.hydrologySourceInflow??null,
        flowX:tile.flowX??null,flowY:tile.flowY??null,
        persistentQ:flux("hydrologyEdgeDischarge"),solverOutflows:flux("hydrologyEdgeOutflows")};
    }

    function waterTargets(renderer){
      const water=renderer?.water;if(!water)return[];
      const targets=[];
      for(const value of water.surfaceMeshes.values())if(value)targets.push(value);
      // New Q-only per-tile sheet meshes must participate in ray diagnostics.
      for(const value of water.sheetFlowMeshes?.values?.()||[])if(value)targets.push(value);
      for(const value of water.runoffs.values())if(value)targets.push(value?.mesh||value);
      for(const value of water.cascades.values())if(value?.mesh)targets.push(value.mesh);
      for(const value of water.sourceFootprints.values())if(value)targets.push(value?.mesh||value);
      return targets.filter(mesh=>mesh&&!mesh.isDisposed?.()&&mesh.getTotalVertices?.()>0);
    }

    function inspectWaterAt(win,doc,runtime,clientX,clientY){
      const renderer=win.CardTacticsRenderer,{scene,canvas,camera,engine}=renderer;
      if(!scene||!canvas||!camera?.camera)return;
      const rect=canvas.getBoundingClientRect();
      const x=(clientX-rect.left)*engine.getRenderWidth()/Math.max(1,rect.width);
      const y=(clientY-rect.top)*engine.getRenderHeight()/Math.max(1,rect.height);
      const ray=scene.createPickingRay(x,y,win.BABYLON.Matrix.Identity(),camera.camera);
      const targets=waterTargets(renderer),terrainMeshes=scene.meshes.filter(mesh=>["terrain-surface","terrain-cliffs"].includes(mesh?.metadata?.kind));
      const changed=[];
      for(const mesh of [...targets,...terrainMeshes]){
        changed.push([mesh,mesh.isPickable]);mesh.isPickable=true;
      }
      let waterHit,terrainHit;
      try{
        const set=new Set(targets),groundSet=new Set(terrainMeshes);
        waterHit=scene.pickWithRay(ray,mesh=>set.has(mesh));
        terrainHit=scene.pickWithRay(ray,mesh=>groundSet.has(mesh));
      }finally{for(const [mesh,previous] of changed)mesh.isPickable=previous;}
      const pick=terrainHit?.hit?terrainHit:waterHit;
      // Inspect the actual terrain beneath the tap, even when a translucent
      // water triangle was hit nearer to the camera or lies behind terrain.
      const pos=pick?.pickedPoint;
      const map=runtime.getBattleMap?.(),tiles=map?.tiles||[];
      const lookup=new Map(tiles.map(t=>[`${t.x},${t.y}`,t]));
      const worldTile=pos?lookup.get(`${Math.round(pos.x/TILE_SIZE)},${Math.round(pos.z/TILE_SIZE)}`):null;
      const mesh=waterHit?.hit?waterHit.pickedMesh:null;
      const matches=/^(?:runoff|cascade)-(-?\d+),(-?\d+)->(-?\d+),(-?\d+)$/.exec(mesh?.name||"");
      const spring=/^spring-outlet-(-?\d+)-(-?\d+)$/.exec(mesh?.name||"");
      const from=matches?lookup.get(`${matches[1]},${matches[2]}`):spring?lookup.get(`${spring[1]},${spring[2]}`):worldTile;
      const to=matches?lookup.get(`${matches[3]},${matches[4]}`):null;
      const hydrology=win.HydrologyEngine;
      const edge=to?hydrology?.edgeFlowState?.(from,to):null;
      const surface=renderer.terrain?.surfaceResolver;
      const geom=worldTile?surface?.getRenderedSurfaceGeometry?.(worldTile):null;
      const direction=from&&to?{dx:Math.sign(to.x-from.x),dy:Math.sign(to.y-from.y)}:null;
      const cliff=direction?surface?.getRenderedCliffGeometry?.(from,direction):null;
      const metadata=mesh?.metadata||{};
      const selectedMetadata=Object.fromEntries(Object.entries(metadata).filter(([key,val])=>
        val===null||["string","number","boolean"].includes(typeof val)||key==="spillIntervals"||key==="runoffSegments"||key==="actualSourceFlowEdges"
      ));
      const measuredGroundY=pos&&worldTile?renderer.water?.renderedTerrainYAtPoint?.(worldTile,pos):null;
      const material=mesh?.material;
      let flowFootprint=null;
      if(matches&&edge?.flowing&&surface){
        const waterEdge={from,to,edgeDischarge:edge.edgeDischarge,persistentRate:edge.persistentRate,rate:edge.rate};
        const streamPath=surface.transportSurfacePath?.(waterEdge)||[];
        flowFootprint={centerPath:streamPath.map(p=>({x:p.x,y:p.y,z:p.z})),
          assumedHalfWidth:surface.transportHalfWidth?.(waterEdge)??null,
          pathEndpointsAreTileCenters:streamPath.length>1&&
            Math.abs(streamPath[0].x-from.x*TILE_SIZE)<1e-6&&
            Math.abs(streamPath[0].z-from.y*TILE_SIZE)<1e-6};
      }
      const tileKey=worldTile?`${worldTile.x},${worldTile.y}`:null;
      const water=renderer.water;
      const sheetNode=tileKey?water?.sheetFlowNetwork?.get(tileKey):null;
      const sheetSolution=tileKey?water?.sheetFlowSurfaces?.get(tileKey):null;
      const sheetMesh=tileKey?water?.sheetFlowMeshes?.get(tileKey):null;
      // Diagnose the actual rendering owner after rainfall changes D on slopes.
      // A fixed corridor could previously be picked as an ordinary runoff
      // even though the real terrain-clipped standing surface also existed.
      const runoffMeshes=[...water?.runoffs?.values?.()||[]]
        .map(entry=>entry?.mesh||entry).filter(mesh=>mesh&&!mesh.isDisposed?.());
      const legacyNonCascadeRunoffs=runoffMeshes.filter(mesh=>
        mesh.metadata?.triangleClippedSurfaceFlow===true);
      const localLegacyRunoffs=legacyNonCascadeRunoffs
        .filter(mesh=>String(mesh.name||'').includes(`${tileKey}->`)||String(mesh.name||'').includes(`->${tileKey}`));
      const standingPolygons=worldTile&&Number(worldTile.waterDepth||0)>0
        ?water?.waterSurfacePolygons?.(worldTile,lookup)||[]:[];
      const renderOwnership=tileKey?{
        tileKey,gameplayWaterDepth:Number(worldTile?.waterDepth||0),
        surfaceOwner:Number(worldTile?.waterDepth||0)>0?'STORED_TERRAIN_CLIPPED_SURFACE'
          :sheetMesh?'Q_ONLY_TERRAIN_SHEET':'NO_RENDERED_SURFACE',
        localStoredWaterPolygons:standingPolygons.length,
        totalStoredSurfaceMeshes:water?.surfaceMeshes?.size??null,
        activeSheetFlowMeshes:water?.sheetFlowMeshes?.size??null,
        totalRunoffMeshes:runoffMeshes.length,
        legacyNonCascadeRunoffMeshes:legacyNonCascadeRunoffs.length,
        localLegacyRunoffMeshNames:localLegacyRunoffs.map(mesh=>mesh.name),
        remainingCliffJunctionRunoffs:runoffMeshes.filter(mesh=>mesh.metadata?.cascade===true).length
      }:null;
      // Sample the SAME polygons consumed by buildSheetFlow. A missing wet
      // polygon proves a dry/clipped point; it is not evidence of occlusion.
      const sampleSheet=()=>{
        if(!pos||!sheetSolution)return null;
        for(const polygon of sheetSolution.polygons||[]){
          const points=polygon.points||[];
          for(let i=1;i+1<points.length;i++){
            const a=points[0],b=points[i],c=points[i+1];
            const det=(b.x-a.x)*(c.z-a.z)-(c.x-a.x)*(b.z-a.z);
            if(Math.abs(det)<1e-12)continue;
            const u=((pos.x-a.x)*(c.z-a.z)-(pos.z-a.z)*(c.x-a.x))/det;
            const v=((pos.z-a.z)*(b.x-a.x)-(pos.x-a.x)*(b.z-a.z))/det;
            if(u< -1e-7||v< -1e-7||u+v>1+1e-7)continue;
            const depth=a.depth*(1-u-v)+b.depth*u+c.depth*v;
            const terrainY=a.y*(1-u-v)+b.y*u+c.y*v;
            return{triangleIndex:polygon.triangleIndex,visualFilmDepth:depth,
              terrainY,predictedWaterYWithoutRenderOffset:terrainY+depth,
              localWetPolygon:true};
          }
        }
        return{localWetPolygon:false,reason:"POINT_CLIPPED_OR_DRY"};
      };
      const nodeEdges=sheetNode?[...(sheetNode.incoming||[]),...(sheetNode.outgoing||[])]:[];
      const sheetFlowDiagnosis=tileKey?{
        tileKey,waterDepth:Number(worldTile?.waterDepth||0),
        sheetFlowMeshExists:!!sheetMesh&&!sheetMesh.isDisposed?.(),
        sheetFlowSolutionExists:!!sheetSolution,
        sheetStatus:sheetNode?.sheetStatus||"NO_NETWORK_NODE",
        sheetRejectReason:sheetNode?.sheetRejectReason||null,
        sheetAcceptedEdges:sheetNode?.sheetAcceptedEdges||[],
        sheetRejectedEdges:sheetNode?.sheetRejectedEdges||[],
        boundaryEdges:nodeEdges.map(e=>({id:e.id,q:e.q,transportVolume:e.transportVolume,
          geometryJoinValid:e.geometryJoinValid,geometryJoin:e.geometryJoin,cascade:e.cascade})),
        sourceRate:sheetNode?.sourceRate??null,qIn:sheetNode?.qIn??null,qOut:sheetNode?.qOut??null,
        registeredTerrainTriangles:geom?.triangles?.length??null,
        wetTriangleCount:sheetSolution?.polygons?.length??0,
        sheetFlowWetArea:sheetSolution?.wetArea??null,
        sheetFlowCoreWetArea:sheetSolution?.coreWetArea??null,
        sheetFlowShoulderWetArea:sheetSolution?.shoulderWetArea??null,
        sheetFlowRegisteredProjectedArea:sheetSolution?.renderedProjectedArea??null,
        sheetFlowCoreProjectedArea:sheetSolution?.coreProjectedArea??null,
        sheetFlowShoulderProjectedArea:sheetSolution?.shoulderProjectedArea??null,
        sheetFlowNominalTileArea:sheetSolution?.nominalTileArea??null,
        renderedVolumeProxy:sheetSolution?.renderedVolumeProxy??null,
        volumeProxyBasis:sheetMesh?.metadata?.volumeProxyBasis??null,
        sheetFlowMaxDepth:sheetSolution?.maxDepth??null,
        actualMeshMaterialName:sheetMesh?.material?.name??null,
        actualMeshVertexAlphaMin:sheetMesh?.metadata?.minVertexAlpha??null,
        actualMeshVertexAlphaMax:sheetMesh?.metadata?.maxVertexAlpha??null,
        usingSharedWaterSurfaceMaterial:sheetMesh?.material===water?.surfaceMaterial,
        legacySourceRibbonMeshes:water?.sourceFootprints?.size??null,
        targetVolumeProxy:sheetSolution?.targetVolume??null,
        resolvedVolumeProxy:sheetSolution?.volumeProxyAfterSeam??null,
        localSurfaceSample:sampleSheet()
      }:null;
      const report={
        label:"Card Tactics 2 - Hydrology Click Diagnostics",
        seed:currentSeed,springMode:doc.getElementById("testLabSpring")?.value,
        meshName:mesh?.name||null,meshKind:metadata.kind||null,
        pickedTerrainMeshName:terrainHit?.hit?terrainHit.pickedMesh?.name:null,
        renderOwnership,
        sheetFlow:sheetFlowDiagnosis,
        visibleWaterMeshPicked:!!mesh,
        terrainOccludesWater:!!(waterHit?.hit&&terrainHit?.hit&&terrainHit.distance+0.0001<waterHit.distance),
        waterHitDistance:waterHit?.hit?waterHit.distance:null,
        actualWaterHitY:waterHit?.hit?waterHit.pickedPoint?.y??null:null,
        terrainHitDistance:terrainHit?.hit?terrainHit.distance:null,
        actualWaterHitHeightMinusTerrain:waterHit?.hit&&terrainHit?.hit
          ?Number(waterHit.pickedPoint.y)-Number(terrainHit.pickedPoint.y):null,
        terrainHitIsInspectionAnchor:true,
        worldPoint:pos?{x:pos.x,y:pos.y,z:pos.z}:null,
        renderedTerrainYAtPoint:measuredGroundY,
        waterHeightMinusTerrain:pos&&Number.isFinite(measuredGroundY)?pos.y-measuredGroundY:null,
        meshTriangleCount:mesh?.getTotalIndices?.()/3??null,
        meshVisibility:mesh?.visibility??null,
        meshAlphaIndex:mesh?.alphaIndex??null,
        material:material?{name:material.name,alpha:material.alpha??null,transparencyMode:material.transparencyMode??null,
          backFaceCulling:material.backFaceCulling,disableDepthWrite:material.disableDepthWrite,
          zOffset:material.zOffset}:null,
        meshMetadata:selectedMetadata,
        transportFootprint:flowFootprint,
        tile:tileSnapshot(worldTile,hydrology),
        edgeFrom:tileSnapshot(from,hydrology),edgeTo:tileSnapshot(to,hydrology),
        measuredEdgeFlow:edge?{flowing:edge.flowing,cascade:edge.cascade,sheetFlow:edge.sheetFlow,edgeDischarge:edge.edgeDischarge,transportVolume:edge.transportVolume,solverRate:edge.solverRate,surfaceDrop:edge.surfaceDrop,reason:edge.reason}:null,
        registeredSurfaceTriangles:geom?.triangles?.length??null,
        registeredCliff:cliff?{lip:cliff.lip,foot:cliff.foot,segments:cliff.segments?.length,drop:cliff.drop}:null,
        visualOnlyOvertopping:direction?!!surface?.storedWaterCliffOvertopping?.(from,to,direction):null
      };
      latestHydrologyLog=report;
      const panel=doc.getElementById("waterInspectPanel");panel.classList.add("open");
      doc.getElementById("testLabLogText").textContent=JSON.stringify(report,null,2);
      console.info("[Card Tactics Water Click]",report);
    }

    function installWaterInspection(win,doc,runtime){
      const overlay=ensureOverlay(doc),input=win.CardTacticsRenderer?.input,canvas=win.CardTacticsRenderer?.canvas;
      if(!input||!canvas)return;
      // Existing pointer gesture controller still handles panning/pinch, and
      // the test-only selection replaces its tile action with diagnostics.
      let inspectEnabled=true,start=null;
      input.onTilePicked=()=>{};
      overlay.inspect.onclick=()=>{
        inspectEnabled=!inspectEnabled;
        overlay.inspect.textContent=`點選診斷：${inspectEnabled?"開":"關"}`;
        overlay.inspect.classList.toggle("inspection-on",inspectEnabled);
        overlay.inspect.setAttribute("aria-pressed",String(inspectEnabled));
      };
      canvas.addEventListener("pointerdown",event=>{start={id:event.pointerId,x:event.clientX,y:event.clientY};});
      canvas.addEventListener("pointercancel",()=>{start=null;});
      canvas.addEventListener("pointerup",event=>{
        if(!start||start.id!==event.pointerId)return;
        const moved=Math.hypot(start.x-event.clientX,start.y-event.clientY);start=null;
        if(inspectEnabled&&moved<=(event.pointerType==="touch"?12:6))inspectWaterAt(win,doc,runtime,event.clientX,event.clientY);
      });
      doc.getElementById("testLabCloseLog").onclick=()=>overlay.panel.classList.remove("open");
      doc.getElementById("testLabCopyLog").onclick=async()=>{
        if(!latestHydrologyLog)return;
        const content=JSON.stringify(latestHydrologyLog,null,2);
        try{
          await navigator.clipboard.writeText(content);
          doc.getElementById("testLabCopyLog").textContent="已複製";
        }catch(error){
          const area=doc.createElement("textarea");area.value=content;area.style.position="fixed";area.style.left="-9999px";
          doc.body.appendChild(area);area.select();doc.execCommand("copy");area.remove();
          doc.getElementById("testLabCopyLog").textContent="已複製";
        }
      };
    }

    frame.addEventListener("load",async()=>{
      try{
        const win=frame.contentWindow,doc=frame.contentDocument;
        await waitFor(()=>win.CardTacticsRuntime&&win.CardTacticsRenderer&&win.MapGenerator&&win.BABYLON);
        injectTestStyle(doc);const overlay=ensureOverlay(doc);
        overlay.refresh.onclick=()=>generateTestMap(win,doc,{reuseSeed:false});
        overlay.rebuild.onclick=()=>generateTestMap(win,doc,{reuseSeed:true});
        overlay.seed.onkeydown=event=>{if(event.key==="Enter")generateTestMap(win,doc,{reuseSeed:true});};
        overlay.spring.onchange=()=>generateTestMap(win,doc,{reuseSeed:true});
        installWaterInspection(win,doc,win.CardTacticsRuntime);
        await generateTestMap(win,doc,{reuseSeed:false});
        startMarkerLoop(win,doc,win.CardTacticsRuntime);
        boot.classList.add("hidden");
      }catch(error){
        console.error(error);boot.textContent=`Test Lab 啟動失敗｜${error?.message||error}`;
      }
    });
  </script>
</body>
</html>

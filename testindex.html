    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071018}
    #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#071018;color:#dbe8f4;font-weight:800;letter-spacing:.04em}
    #boot.hidden{display:none}

<body>
  <iframe id="game" src="./index.html" title="Card Tactics Test Lab"></iframe>
  <div id="boot">載入 Card Tactics Test Lab...</div>
  <script type="module">
    const {TILE_SIZE,ELEVATION_HEIGHT}=await import("./js/coordinate-system.js");
    const frame=document.getElementById("game"),boot=document.getElementById("boot");
    let markerRaf=0,refreshing=false,advancing=false,currentSeed=null,latestHydrologyLog=null;
    let environmentHistory=[],lastInspectedTileKey=null;
    // Test Lab telemetry reads the existing Runtime and Renderer. It never owns game state.
    const STRESS_STORE="ct:testindex:integrated-stress:v1",MAX_STRESS_RECORDS=180;
    let stressRecords=[],stressRunning=false,stressStopRequested=false,stressSession=null;
    let controlsCollapsed=true,stressCurrentStep=0,stressTotalSteps=0;
    function readStressHistory(){
      try{
        const stored=JSON.parse(localStorage.getItem(STRESS_STORE)||"null");
        if(!stored||!Array.isArray(stored.records))return;
        stressRecords=stored.records.slice(-MAX_STRESS_RECORDS);
        if(stored.running){
          stressRecords.push({at:new Date().toISOString(),type:"INTERRUPTED",reason:"PREVIOUS_RUN_NO_COMPLETION_MARKER",lastStep:stored.step??null});
          stressRecords=stressRecords.slice(-MAX_STRESS_RECORDS);
          persistStress(); // The interrupted run must not be reported twice on reload.
        }
      }catch(error){console.warn("TEST LAB retained report unreadable",error);}
    }
    function persistStress(){
      try{localStorage.setItem(STRESS_STORE,JSON.stringify({version:1,at:new Date().toISOString(),running:stressRunning,step:stressCurrentStep,seed:currentSeed,records:stressRecords.slice(-MAX_STRESS_RECORDS)}));}
      catch(error){console.warn("TEST LAB log persistence failed",error);}
    }
    function stressLog(type,detail={}){
      const entry={at:new Date().toISOString(),type,...detail};
      stressRecords.push(entry);
      if(stressRecords.length>MAX_STRESS_RECORDS)stressRecords.shift();
      persistStress();
      return entry;
    }
    readStressHistory();
    window.addEventListener("pagehide",persistStress);
    window.addEventListener("error",event=>stressLog("WINDOW_ERROR",{message:String(event.message||"error").slice(0,400)}));
    window.addEventListener("unhandledrejection",event=>stressLog("REJECTION",{message:String(event.reason?.message||event.reason||"unknown").slice(0,400)}));

    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const waitFor=async test=>{
      for(let i=0;i<900;i++){
        const value=test();
        if(value)return value;
        await sleep(20);
      }
      throw new Error("Card Tactics Runtime 載入逾時");
    };

        .test-lab-stress-preview{margin:0;max-height:20vh;overflow:auto;padding:7px;background:#020b13;border:1px solid #344d64;border-radius:6px;color:#bcdfcc;font:10px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}

      doc.head.appendChild(style);
    }

    function showBattle(doc,win){
      doc.body.classList.add("card-tactics-test-mode");
      doc.querySelectorAll(".game-screen").forEach(node=>node.classList.toggle("active",node.id==="battleScreen"));
      win.CardTacticsRenderer?.resize?.();
      win.CardTacticsRenderer?.resetView?.();
      win.dispatchEvent(new win.CustomEvent("cardtactics:battle-screen-enter"));
      win.dispatchEvent(new win.CustomEvent("cardtactics:battle-render"));
    }

    function markerRecords(runtime){
      const map=runtime.getBattleMap?.();
      const records=[];
      for(const tile of map?.tiles||[]){
        if(tile?.hydrologySource===true&&tile?.hydrologySourceDisabled!==true){
          const kind=String(tile.sourceKind||"").toUpperCase();
          if(kind==="OFF_MAP_SOURCE")records.push({kind:"entry",label:"入口／水源",tile});
          else if(kind==="SPRING_SOURCE")records.push({kind:"spring",label:"泉眼／水源",tile});
          else records.push({kind:"source",label:"水源",tile});
        }
        if(tile?.hydrologyDrain===true||tile?.drain===true)records.push({kind:"outlet",label:"出口",tile});
      }
      return records;
    }

        doc.body.classList.toggle("test-lab-controls-collapsed",controlsCollapsed);

          </div>`;

              <option value="SNOW">降雪</option><option value="BLIZZARD">暴風雪</option>

          </div>
          <div class="weather-row">
            <label>套用方式 <select id="testLabWeatherMode"><option value="CARD" selected>同氣候卡（下回合降雨）</option><option value="PULSE">TEST 即時脈衝</option></select></label>
            <button id="testLabApplyWeather" type="button">設定天氣</button>
          </div>
          <div class="weather-row">
            <label>風向 <select id="testLabWindDirection"><option value="CALM" selected>無風</option><option value="N">北向</option><option value="NE">東北</option><option value="E">東向</option><option value="SE">東南</option><option value="S">南向</option><option value="SW">西南</option><option value="W">西向</option><option value="NW">西北</option></select></label>

          </div>

      let layer=doc.getElementById("hydrologyTestMarkers");

        panel=doc.createElement("section");panel.id="waterInspectPanel";panel.className="water-inspect-panel";

        battle.appendChild(panel);
      }

        stressQuick:doc.getElementById("testLabStressQuick"),stressRun:doc.getElementById("testLabStressRun"),
        stressStop:doc.getElementById("testLabStressStop"),stressScenario:doc.getElementById("testLabStressScenario"),
        stressCopy:doc.getElementById("testLabStressCopy"),stressSave:doc.getElementById("testLabStressSave"),
        stressClear:doc.getElementById("testLabStressClear"),dayNight:doc.getElementById("testLabDayNight"),
        applyDayNight:doc.getElementById("testLabApplyDayNight"),
        weather:doc.getElementById("testLabWeather"),weatherTurns:doc.getElementById("testLabWeatherTurns"),
        weatherMode:doc.getElementById("testLabWeatherMode"),
        windDirection:doc.getElementById("testLabWindDirection"),windStrength:doc.getElementById("testLabWindStrength"),applyWind:doc.getElementById("testLabApplyWind"),
        applyWeather:doc.getElementById("testLabApplyWeather"),advanceOne:doc.getElementById("testLabAdvanceOne"),
        advanceFive:doc.getElementById("testLabAdvanceFive"),copyTimeline:doc.getElementById("testLabCopyTimeline"),
        spring:doc.getElementById("testLabSpring"),
        inspect:doc.getElementById("testLabInspect"),
        refresh:doc.getElementById("testLabRefresh"),
        rebuild:doc.getElementById("testLabRebuild"),
        seed:doc.getElementById("testLabSeed"),
        info:doc.getElementById("testLabInfo")
      };
    }

    function globalThisHydrologyCapacity(tile){
      const win=frame.contentWindow;
      return Number(win?.HydrologyEngine?.soilCapacity?.(tile)??0);
    }

    function rebuildMarkers(doc,runtime){
      const {layer}=ensureOverlay(doc);layer.replaceChildren();
      for(const record of markerRecords(runtime)){
        const node=doc.createElement("div");node.className=`hydrology-test-marker ${record.kind}`;
        const qIn=Math.max(0,Number(record.tile.hydrologySourceInflow??record.tile.hydrologyRequestedSourceInflow??record.tile.discharge??0));
        const qOut=Object.values(record.tile.hydrologyEdgeDischarge||{}).reduce((sum,edge)=>sum+Math.max(0,Number(edge?.rate||0)),0);
        const depth=Math.max(0,Number(record.tile.waterDepth||0));
        const soil=Math.max(0,Number(record.tile.soilMoisture||0)),soilCap=Math.max(0,Number(globalThisHydrologyCapacity(record.tile)??0));
        node.textContent=`${record.label} (${record.tile.x},${record.tile.y})${record.kind==="entry"||record.kind==="spring"?` Qin ${qIn.toFixed(2)}｜Qout ${qOut.toFixed(2)}｜D ${depth.toFixed(2)}｜Soil ${soil.toFixed(2)}/${soilCap.toFixed(2)}`:""}`;
        node.dataset.x=String(record.tile.x);node.dataset.y=String(record.tile.y);layer.appendChild(node);
      }
    }

    function updateMarkerFrame(win,doc,runtime){
      const renderer=win.CardTacticsRenderer,camera=renderer?.camera?.camera,scene=renderer?.scene,engine=renderer?.engine,canvas=renderer?.canvas;
      const layer=doc.getElementById("hydrologyTestMarkers");
      if(!renderer||!camera||!scene||!engine||!canvas||!layer)return;
      const map=runtime.getBattleMap?.(),byKey=new Map((map?.tiles||[]).map(tile=>[`${tile.x},${tile.y}`,tile]));
      const renderWidth=Math.max(1,engine.getRenderWidth()),renderHeight=Math.max(1,engine.getRenderHeight());
      const viewport=camera.viewport.toGlobal(renderWidth,renderHeight),transform=scene.getTransformMatrix();
      const canvasRect=canvas.getBoundingClientRect(),rootRect=layer.getBoundingClientRect();
      const scaleX=canvasRect.width/renderWidth,scaleY=canvasRect.height/renderHeight,offsetX=canvasRect.left-rootRect.left,offsetY=canvasRect.top-rootRect.top;
      for(const node of layer.children){
        const tile=byKey.get(`${node.dataset.x},${node.dataset.y}`);if(!tile){node.hidden=true;continue;}
        const surface=Math.max(Number(tile.elevation||0),Number(tile.elevation||0)+Math.max(0,Number(tile.waterDepth||0)));
        const world=new win.BABYLON.Vector3(Number(tile.x)*TILE_SIZE,surface*ELEVATION_HEIGHT+.62,Number(tile.y)*TILE_SIZE);
        const p=win.BABYLON.Vector3.Project(world,win.BABYLON.Matrix.Identity(),transform,viewport),x=offsetX+p.x*scaleX,y=offsetY+p.y*scaleY;
        const visible=p.z>=0&&p.z<=1&&x>-120&&x<rootRect.width+120&&y>-80&&y<rootRect.height+80;
        node.hidden=!visible;if(!visible)continue;node.style.left=`${x}px`;node.style.top=`${y}px`;
      }
    }

    function startMarkerLoop(win,doc,runtime){
      cancelAnimationFrame(markerRaf);
      const tick=()=>{if(!controlsCollapsed&&!stressRunning)updateMarkerFrame(win,doc,runtime);markerRaf=requestAnimationFrame(tick);};tick();

    // TEST LAB only invokes the actual Battle Runtime's debug hooks to advance
    // game weather and hydrology. No second weather scheduler or flow engine.
    function hydrologyFrame(win,runtime,label){
      const map=runtime.getBattleMap?.(),tiles=map?.tiles||[],engine=win.HydrologyEngine,water=win.CardTacticsRenderer?.water;
      const sum=(values)=>values.reduce((a,b)=>a+Number(b||0),0);
      const persistent=tiles.flatMap(tile=>Object.values(tile.hydrologyEdgeDischarge||{}));
      const solver=tiles.flatMap(tile=>Object.values(tile.hydrologyEdgeOutflows||{}));
      const debug=runtime.debug?.state?.()||{};
      const cascadeEntries=[...water?.cascades?.values?.()||[]];
      const cascadesWithStoredOvertopping=cascadeEntries.filter(e=>e?.mesh?.metadata?.storedWaterOvertopping===true);
      const cascadesWithoutTransport=cascadeEntries.filter(e=>
        Number(e?.mesh?.metadata?.transportVolume||0)<=0.0001&&Number(e?.mesh?.metadata?.edgeDischarge||0)<=0.0001);
      const storedOvertoppingJunctions=cascadesWithStoredOvertopping.filter(e=>
        e?.root?.getChildMeshes?.().some(m=>m.metadata?.kind==="water-cascade-junction"));
      const focus=lastInspectedTileKey;
      const [sx,sy]=focus?.split(",").map(Number)||[];
      const nearby=focus?tiles.filter(t=>Math.abs(t.x-sx)+Math.abs(t.y-sy)<=1)
        .map(t=>({x:t.x,y:t.y,terrain:t.terrain,D:Number(t.waterDepth||0),soil:Number(engine?.soilMoisture?.(t)??t.soilMoisture??0),
          persistentQ:sum(Object.values(t.hydrologyEdgeDischarge||{}).map(e=>e.rate)),
          solverQ:sum(Object.values(t.hydrologyEdgeOutflows||{}).map(e=>e.rate))})):[];
      return{
        label,seed:currentSeed,environmentStep:Number(debug.environmentSteps||0),gameRound:debug.round??null,
        weather:debug.weather,remainingWeatherTurns:debug.weatherTurnsRemaining??null,climate:debug.climate||null,
        wetTiles:tiles.filter(t=>Number(t.waterDepth||0)>0.0001).length,
        veryShallowStoredTiles:tiles.filter(t=>Number(t.waterDepth||0)>0.0001&&Number(t.waterDepth||0)<=0.001).length,
        gameplayWaterVolume:engine?.surfaceWaterVolume?.(map)??sum(tiles.map(t=>Math.max(0,Number(t.waterDepth||0)))),
        soilWaterVolume:engine?.soilWaterVolume?.(map)??sum(tiles.map(t=>Math.max(0,Number(engine?.soilMoisture?.(t)??t.soilMoisture??0)))),
        persistentQEdges:persistent.length,persistentQTotalRate:sum(persistent.map(e=>e.rate)),
        solverQEdges:solver.length,solverQTotalRate:sum(solver.map(e=>e.rate)),
        sourceRouting:map?.hydrologyPersistentDischargeSummary||null,
        // Geology is authored by MapGenerator; waterDepth is read live from
        // the SAME Hydrology map after each weather/environment step.
        naturalRiverPools:(map?.generatedRiverProfile?.pools||[]).map(pool=>{
          const tile=tiles.find(t=>Number(t.x)===pool.x&&Number(t.y)===pool.y);
          return{x:pool.x,y:pool.y,bed:pool.bed,outletBed:pool.outletBed,
            lowestRim:pool.lowestRim,excavatedDepth:pool.depth,
            actualStoredD:Number(tile?.waterDepth||0),
            actualWaterSurface:tile?.waterSurfaceZ??null,
            actualTerrain:tile?.terrain??null};
        }),
        storedWaterMeshes:water?.surfaceMeshes?.size??null,
        sheetFlowMeshes:water?.sheetFlowMeshes?.size??null,
        waterfallMeshes:water?.cascades?.size??null,
        // A waterfall may be drawn from standing D alone (visual overtopping),
        // even when Hydrology has recorded no transfer across that cliff edge.
        storedOvertoppingWaterfalls:cascadesWithStoredOvertopping.length,
        waterfallsWithoutRecordedTransfer:cascadesWithoutTransport.length,
        storedOvertoppingJunctionMeshes:storedOvertoppingJunctions.length,
        cliffJunctionRunoffs:water?.runoffs?.size??null,
        inspectedTileKey:focus,nearbyTiles:nearby,
        officialSystemLog:runtime.getBattleLog?.("SYSTEM")?.entries?.slice(-14)||[],
        officialDetailLog:runtime.getBattleLog?.("DETAIL")?.entries?.slice(-14)||[]

    }

    async function advanceWeatherInLab(win,doc,runtime,count){

    const stressFrame=win=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
    function stressSample(win,runtime,phase,stepMs=null){
      const scene=win.CardTacticsRenderer?.scene,renderer=win.CardTacticsRenderer||{};
      const map=runtime.getBattleMap?.(),tiles=map?.tiles||[];
      const snapshot=runtime.getBattleSnapshot?.()||{},debug=runtime.debug?.state?.()||{};
      let D=0,soil=0,snow=0,ice=0,wet=0,deep=0,snowTiles=0,iceTiles=0,maxDepth=0,qEdges=0,solverEdges=0;
      for(const tile of tiles){
        const depth=Math.max(0,Number(tile.waterDepth||0)),s=Math.max(0,Number(tile.snowDepth||0)),i=Math.max(0,Number(tile.iceThickness||0));
        D+=depth;soil+=Math.max(0,Number(tile.soilMoisture||0));snow+=s;ice+=i;
        if(depth>.0001)wet++;if(depth>.25)deep++;if(s>.0001)snowTiles++;if(i>.0001)iceTiles++;
        maxDepth=Math.max(depth,maxDepth);
        qEdges+=Object.keys(tile.hydrologyEdgeDischarge||{}).length;
        solverEdges+=Object.keys(tile.hydrologyEdgeOutflows||{}).length;
      }
      // The same source IDs used by EnvironmentRenderer.physicalLightsById.
      const allLightSources=snapshot.presentation?.environment?.lightSources||[];
      const sources=allLightSources.filter(s=>s.source==="CORE_LIGHT"||s.source==="CAPTURE_LIGHT");
      const expected=[...(snapshot.cores||[]).filter(c=>Number(c.hp||0)>0).map(c=>({type:"CORE_LIGHT",id:c.id,x:c.x,y:c.y})),
        ...(snapshot.presentation?.deploymentPoints||[]).filter(p=>(p.owner==="PLAYER"||p.owner==="ENEMY")&&p.capturable!==false&&p.captureTiles?.[0])
          .map(p=>({type:"CAPTURE_LIGHT",id:p.id,x:p.captureTiles[0].x,y:p.captureTiles[0].y}))];
      const physical=renderer.environment?.physicalLightsById||new Map();
      const cellLight=renderer.environment?.litCellColors?.(snapshot)||new Map();
      const lightSites=[],lightIssues=[];
      for(const site of expected){
        const authored=sources.find(s=>s.source===site.type&&String(s.sourceId)===String(site.id));
        const key=`${site.type}:${site.id}`,lamp=physical.get(key);
        const mesh=site.type==="CORE_LIGHT"?renderer.objectives?.cores?.get(site.id):renderer.objectives?.points?.get(site.id);
        const receivers=lamp?.includedOnlyMeshes||[];
        const material=mesh?.material;
        const hasLightField=(cellLight.get(`${site.x},${site.y}`)||[]).some(v=>Number(v)>0);
        const present=!!lamp&&!lamp.isDisposed?.(),meshExists=!!mesh&&!mesh.isDisposed?.();
        const enabled=present&&lamp.isEnabled?.()===true;
        const assigned=meshExists&&present&&receivers.includes(mesh);
        const emission=material?.emissiveColor;
        const ownEmission=emission?Number(emission.r||0)+Number(emission.g||0)+Number(emission.b||0):null;
        const issues=[];
        if(!authored)issues.push("NO_PRESENTATION_SOURCE");
        if(!meshExists)issues.push("NO_OBJECTIVE_MESH");
        if(!present)issues.push("NO_PHYSICAL_LIGHT");
        if(!hasLightField)issues.push("NO_TERRAIN_LIGHT_FIELD");
        if(meshExists&&present&&!assigned)issues.push("OBJECTIVE_NOT_IN_LIGHT_RECEIVERS");
        if(meshExists&&present&&!enabled)issues.push("OBJECTIVE_LIGHT_DISABLED");
        const detail={type:site.type,id:site.id,x:site.x,y:site.y,sourcePresent:!!authored,
          fieldLit:hasLightField,physicalPresent:present,physicalEnabled:enabled,receiverAssigned:assigned,
          receiverCount:receivers.length,meshPresent:meshExists,emissiveTotal:ownEmission,issues};
        lightSites.push(detail);
        for(const issue of issues)lightIssues.push(`${key}:${issue}`);
      }
      const lightSourceIds=[...new Set(sources.map(s=>`${s.source}:${s.sourceId}`))];
      // Do not claim capture 2 was tested unless at least two actual held sites exist.
      const heldCaptureSites=expected.filter(p=>p.type==="CAPTURE_LIGHT").length;
      const lightSourceTypes={};for(const source of allLightSources)lightSourceTypes[source.source]=(lightSourceTypes[source.source]||0)+1;
      const fireSources=allLightSources.filter(s=>s.source==="BURNING"||s.source==="FIRE_TORNADO");
      // Fire should light its authored 3x3 field, including under natural fog.
      const validCoords=new Set(tiles.map(t=>`${t.x},${t.y}`));
      for(const source of fireSources)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const key=`${Number(source.x)+dx},${Number(source.y)+dy}`;
        if(validCoords.has(key)&&!(cellLight.get(key)||[]).some(v=>Number(v)>0))
          lightIssues.push(`${source.source}:${source.x},${source.y}:FIRE_3X3_UNLIT:${key}`);
      }
      return{
        phase,stepMs,seed:currentSeed,environmentSteps:debug.environmentSteps??null,
        timeOfDay:debug.timeOfDay,weather:debug.weather,round:debug.round,
        tileCount:tiles.length,D:+D.toFixed(4),soil:+soil.toFixed(4),wetTiles:wet,
        deepTiles:deep,maxDepth:+maxDepth.toFixed(4),snow:+snow.toFixed(4),ice:+ice.toFixed(4),snowTiles,iceTiles,
        persistentQEdges:qEdges,solverQEdges:solverEdges,
        meshes:scene?.meshes?.length??null,geometries:scene?.geometries?.length??null,
        textures:scene?.textures?.length??null,materials:scene?.materials?.length??null,
        sceneLights:scene?.lights?.length??null,activeMeshes:scene?.getActiveMeshes?.()?.length??null,
        physicalLights:physical.size,lightFieldCells:renderer.environment?.lightFieldCells??null,
        waterMeshes:renderer.water?.surfaceMeshes?.size??null,
        cascadeMeshes:renderer.water?.cascades?.size??null,runoffMeshes:renderer.water?.runoffs?.size??null,
        fps:Number.isFinite(renderer.engine?.getFps?.())?Math.round(renderer.engine.getFps()):null,
        lightSourceTypes,fireSources:fireSources.length,enabledPhysicalLights:[...physical.values()].filter(light=>light?.isEnabled?.()).length,
        rendererErrors:[...renderer.subsystemErrors||[]].map(([key,error])=>[key,String(error?.message||error).slice(0,160)]),
        heapMB:Number.isFinite(win.performance?.memory?.usedJSHeapSize)?Math.round(win.performance.memory.usedJSHeapSize/1048576):null,
        expectedLightSites:expected.length,heldCaptureSites,lightSourceIds,lightSites,lightIssues
      };
    }

    async function runStressLab(win,doc,runtime){
      if(refreshing||advancing||stressRunning)return;
      const overlay=ensureOverlay(doc),scenario=overlay.stressScenario.value;
      const stages=STRESS_SCENARIOS[scenario];if(!stages)return;
      // Disable only the existing test controls that would mutate the map.
      stressRunning=true;stressStopRequested=false;stressCurrentStep=0;
      stressTotalSteps=stages.reduce((sum,stage)=>sum+stage.turns,0);
      stressSession={scenario,seed:currentSeed,startedAt:new Date().toISOString(),totalSteps:stressTotalSteps};
      overlay.stressRun.disabled=true;overlay.stressStop.disabled=false;overlay.stressScenario.disabled=true;
      setWeatherLabBusy(overlay,true);
      const initial=stressSample(win,runtime,"BASELINE"),summary={maxD:initial.D,maxWetTiles:initial.wetTiles,maxDeepTiles:initial.deepTiles,
        maxSnow:initial.snow,minD:initial.D,minSnow:initial.snow,errors:new Set(),lightIssueCounts:{}};
      stressLog("START",{scenario,seed:currentSeed,total:stressTotalSteps,...initial});
      const reportStep=(snap)=>{
        summary.maxD=Math.max(summary.maxD,snap.D);summary.minD=Math.min(summary.minD,snap.D);
        summary.maxWetTiles=Math.max(summary.maxWetTiles,snap.wetTiles);
        summary.maxDeepTiles=Math.max(summary.maxDeepTiles,snap.deepTiles);
        summary.maxSnow=Math.max(summary.maxSnow,snap.snow);
        summary.minSnow=Math.min(summary.minSnow,snap.snow);
        for(const err of snap.lightIssues)summary.lightIssueCounts[err]=(summary.lightIssueCounts[err]||0)+1;
        if(snap.rendererErrors.length)summary.errors.add("RENDERER_ERROR");
      };
      try{
        for(const stage of stages){
          if(stressStopRequested)break;
          if(!runtime.debug?.setTimeOfDay?.(stage.time))throw new Error("正式 Runtime 日夜切換失敗");
          if(!runtime.debug?.setWeather?.(stage.weather,stage.turns,{applyPulse:false}))throw new Error(`正式 Runtime 氣候 ${stage.weather} 切換失敗`);
          if(stage.ignite){
            // Official EnvironmentEngine FIRE force, on existing dry vegetation.
            // Never create a visual-only flame or write engine state directly.
            const tiles=runtime.getBattleMap?.()?.tiles||[],midX=Math.max(0,...tiles.map(t=>t.x))/2,midY=Math.max(0,...tiles.map(t=>t.y))/2;
            const candidate=tiles.filter(t=>(t.terrain==="FOREST"||t.terrain==="PLAIN")&&Number(t.waterDepth||0)<.05)
              .sort((a,b)=>Math.hypot(a.x-midX,a.y-midY)-Math.hypot(b.x-midX,b.y-midY))[0];
            const applied=!!candidate&&runtime.debug?.applyEnvironmentForce?.(candidate.x,candidate.y,"FIRE")===true;
            stressLog("FIRE_TEST",{phase:stage.label,applied,position:candidate?{x:candidate.x,y:candidate.y}:null});
          }
          await stressFrame(win);
          const atStart=stressSample(win,runtime,stage.label);
          stressLog("STAGE_START",{label:stage.label,weather:stage.weather,time:stage.time,turns:stage.turns,...atStart});
          for(let i=0;i<stage.turns;i++){
            if(stressStopRequested)break;
            const before=performance.now();
            if(!runtime.debug?.advanceEnvironmentTurns?.(1))throw new Error("正式 Runtime 環境推進失敗");
            // The game's existing state event schedules Babylon sync into RAF.
            // Give that same renderer two frames to finish before sampling.
            await stressFrame(win);
            stressCurrentStep++;
            const snap=stressSample(win,runtime,stage.label,Math.round(performance.now()-before));
            reportStep(snap);
            stressLog("STEP",{step:stressCurrentStep,total:stressTotalSteps,...snap});
            recordHydrologyFrame(win,runtime,`壓測 ${stage.label} ${i+1}/${stage.turns}`);
            refreshStressPreview(doc);
            if((i+1)%5===0||i+1===stage.turns){rebuildMarkers(doc,runtime);refreshWeatherPanel(win,doc,runtime);}
            // Yield between heavy environment passes so mobile can paint input.
            await sleep(100);
          }
          stressLog("STAGE_END",{label:stage.label,step:stressCurrentStep,...stressSample(win,runtime,stage.label)});
        }
        const final=stressSample(win,runtime,"FINAL");
        const warnings=[];
        if(scenario==="ALL"||scenario==="FLOOD"){
          // More standing-water volume or deeper wet cells is evidence that
          // flooding was actually exercised, not just a weather label change.
          if(summary.maxD<=initial.D+Math.max(.5,initial.D*.015)&&summary.maxWetTiles<=initial.wetTiles)
            warnings.push("淹水水量未明顯增加：本 Seed 無法宣稱已覆蓋大淹水");
        }
        if((scenario==="ALL"||scenario==="SNOW")&&summary.maxSnow<=initial.snow+.2)
          warnings.push("積雪量未明顯增加：本 Seed 無法宣稱已覆蓋積雪融雪");
        if(final.heldCaptureSites<2)warnings.push("目前沒有兩個已佔領據點：不能宣稱已驗證連佔兩點");
        if((scenario==="ALL"||scenario==="LIGHT")&&!stressRecords.slice(-stressTotalSteps-35).some(r=>r.type==="STEP"&&r.fireSources>0))
          warnings.push("測試期間未觀測到真實野火光源：無法驗收火光散射");
        if(Object.keys(summary.lightIssueCounts).length)warnings.push("發現光源資料／實體光源／模型受光對帳不一致");
        if(summary.errors.size)warnings.push("Renderer 回報錯誤");
        const kind=stressStopRequested?"STOP":"DONE";
        stressRunning=false;
        stressLog(kind,{step:stressCurrentStep,total:stressTotalSteps,summary:{...summary,errors:[...summary.errors]},warnings,...final});
        refreshStressPreview(doc,`${kind} ${stressCurrentStep}/${stressTotalSteps}｜${warnings.length?warnings.join("；"):"未發現上述可觀測異常；仍需實機確認畫面"}`);
      }catch(error){
        stressRunning=false;
        stressLog("STRESS_ERROR",{step:stressCurrentStep,message:String(error?.stack||error).slice(0,800)});
        refreshStressPreview(doc,`壓測中斷：${error?.message||error}`);
      }finally{
        stressRunning=false;stressStopRequested=false;
        overlay.stressRun.disabled=false;overlay.stressStop.disabled=true;overlay.stressScenario.disabled=false;
        setWeatherLabBusy(overlay,false);persistStress();
      }
    }

    function tileSnapshot(tile,hydrology){
      if(!tile)return null;
      const flux=field=>Object.fromEntries(Object.entries(tile[field]||{}).map(([dir,record])=>[dir,{
        rate:record?.rate??null,volume:record?.volume??null,transportVolume:record?.transportVolume??null,
        fromSurface:record?.fromSurface??null,toSurface:record?.toSurface??null
      }]));
      return{x:tile.x,y:tile.y,terrain:tile.terrain,elevation:tile.elevation,
        waterDepth:tile.waterDepth,waterSurfaceZ:tile.waterSurfaceZ,
        soilMoisture:tile.soilMoisture,soilCapacity:hydrology?.soilCapacity?.(tile)??null,
        hydrologySource:tile.hydrologySource===true,hydrologySourceDisabled:tile.hydrologySourceDisabled===true,
        sourceKind:tile.sourceKind??null,hydrologySourceInflow:tile.hydrologySourceInflow??null,
        flowX:tile.flowX??null,flowY:tile.flowY??null,
        persistentQ:flux("hydrologyEdgeDischarge"),solverOutflows:flux("hydrologyEdgeOutflows")};
    }

    function waterTargets(renderer){
      const water=renderer?.water;if(!water)return[];
      const targets=[];
      for(const value of water.surfaceMeshes.values())if(value)targets.push(value);
      // New Q-only per-tile sheet meshes must participate in ray diagnostics.
      for(const value of water.sheetFlowMeshes?.values?.()||[])if(value)targets.push(value);
      for(const value of water.runoffs.values())if(value)targets.push(value?.mesh||value);
      for(const value of water.cascades.values()){
        if(value?.mesh)targets.push(value.mesh);
        // Stage 7 stored-overflow lip/foot junctions belong to the cascade root,
        // not water.runoffs: include them in picking diagnostics.
        for(const mesh of value?.root?.getChildMeshes?.()||[])
          if(mesh.metadata?.kind==="water-cascade-junction")targets.push(mesh);
      }
      for(const value of water.sourceFootprints.values())if(value)targets.push(value?.mesh||value);
      return targets.filter(mesh=>mesh&&!mesh.isDisposed?.()&&mesh.getTotalVertices?.()>0);
    }

    function inspectWaterAt(win,doc,runtime,clientX,clientY){
      const renderer=win.CardTacticsRenderer,{scene,canvas,camera,engine}=renderer;
      if(!scene||!canvas||!camera?.camera)return;
      const rect=canvas.getBoundingClientRect();
      const x=(clientX-rect.left)*engine.getRenderWidth()/Math.max(1,rect.width);
      const y=(clientY-rect.top)*engine.getRenderHeight()/Math.max(1,rect.height);
      const ray=scene.createPickingRay(x,y,win.BABYLON.Matrix.Identity(),camera.camera);
      const targets=waterTargets(renderer),terrainMeshes=scene.meshes.filter(mesh=>["terrain-surface","terrain-cliffs"].includes(mesh?.metadata?.kind));
      const changed=[];
      for(const mesh of [...targets,...terrainMeshes]){
        changed.push([mesh,mesh.isPickable]);mesh.isPickable=true;
      }
      let waterHit,terrainHit;
      try{
        const set=new Set(targets),groundSet=new Set(terrainMeshes);
        waterHit=scene.pickWithRay(ray,mesh=>set.has(mesh));
        terrainHit=scene.pickWithRay(ray,mesh=>groundSet.has(mesh));
      }finally{for(const [mesh,previous] of changed)mesh.isPickable=previous;}
      const pick=terrainHit?.hit?terrainHit:waterHit;
      // Inspect the actual terrain beneath the tap, even when a translucent
      // water triangle was hit nearer to the camera or lies behind terrain.
      const pos=pick?.pickedPoint;
      // Objective inventory is readable even when no yellow mesh can be picked.
      // The test mode uses the existing ObjectiveRenderer's read-only state.
      const objectiveDiagnostics=renderer.objectives?.diagnostics?.(pos||null)??null;
      const map=runtime.getBattleMap?.(),tiles=map?.tiles||[];
      const lookup=new Map(tiles.map(t=>[`${t.x},${t.y}`,t]));
      const worldTile=pos?lookup.get(`${Math.round(pos.x/TILE_SIZE)},${Math.round(pos.z/TILE_SIZE)}`):null;
      const mesh=waterHit?.hit?waterHit.pickedMesh:null;
      const matches=/^(?:runoff|cascade)-(-?\d+),(-?\d+)->(-?\d+),(-?\d+)$/.exec(mesh?.name||"");
      const spring=/^spring-outlet-(-?\d+)-(-?\d+)$/.exec(mesh?.name||"");
      const from=matches?lookup.get(`${matches[1]},${matches[2]}`):spring?lookup.get(`${spring[1]},${spring[2]}`):worldTile;
      const to=matches?lookup.get(`${matches[3]},${matches[4]}`):null;
      const hydrology=win.HydrologyEngine;
      const edge=to?hydrology?.edgeFlowState?.(from,to):null;
      const surface=renderer.terrain?.surfaceResolver;
      const geom=worldTile?surface?.getRenderedSurfaceGeometry?.(worldTile):null;
      const direction=from&&to?{dx:Math.sign(to.x-from.x),dy:Math.sign(to.y-from.y)}:null;
      const cliff=direction?surface?.getRenderedCliffGeometry?.(from,direction):null;
      const metadata=mesh?.metadata||{};
      const selectedMetadata=Object.fromEntries(Object.entries(metadata).filter(([key,val])=>
        val===null||["string","number","boolean"].includes(typeof val)||key==="spillIntervals"||key==="runoffSegments"||key==="actualSourceFlowEdges"
      ));
      const measuredGroundY=pos&&worldTile?renderer.water?.renderedTerrainYAtPoint?.(worldTile,pos):null;
      const material=mesh?.material;
      let flowFootprint=null;
      if(matches&&edge?.flowing&&surface){
        const waterEdge={from,to,edgeDischarge:edge.edgeDischarge,persistentRate:edge.persistentRate,rate:edge.rate};
        const streamPath=surface.transportSurfacePath?.(waterEdge)||[];
        flowFootprint={centerPath:streamPath.map(p=>({x:p.x,y:p.y,z:p.z})),
          assumedHalfWidth:surface.transportHalfWidth?.(waterEdge)??null,
          pathEndpointsAreTileCenters:streamPath.length>1&&
            Math.abs(streamPath[0].x-from.x*TILE_SIZE)<1e-6&&
            Math.abs(streamPath[0].z-from.y*TILE_SIZE)<1e-6};
      }
      const tileKey=worldTile?`${worldTile.x},${worldTile.y}`:null;
      if(tileKey)lastInspectedTileKey=tileKey;
      const water=renderer.water;
      const sheetNode=tileKey?water?.sheetFlowNetwork?.get(tileKey):null;
      const sheetSolution=tileKey?water?.sheetFlowSurfaces?.get(tileKey):null;
      const sheetMesh=tileKey?water?.sheetFlowMeshes?.get(tileKey):null;
      // Diagnose the actual rendering owner after rainfall changes D on slopes.
      // A fixed corridor could previously be picked as an ordinary runoff
      // even though the real terrain-clipped standing surface also existed.
      const runoffMeshes=[...water?.runoffs?.values?.()||[]]
        .map(entry=>entry?.mesh||entry).filter(mesh=>mesh&&!mesh.isDisposed?.());
      const legacyNonCascadeRunoffs=runoffMeshes.filter(mesh=>
        mesh.metadata?.triangleClippedSurfaceFlow===true);
      const localLegacyRunoffs=legacyNonCascadeRunoffs
        .filter(mesh=>String(mesh.name||'').includes(`${tileKey}->`)||String(mesh.name||'').includes(`->${tileKey}`));
      const hydrologyStorageThreshold=0.0001;
      const storedWaterEligible=Number(worldTile?.waterDepth||0)>hydrologyStorageThreshold;
      const standingPolygons=storedWaterEligible
        ?water?.waterSurfacePolygons?.(worldTile,lookup)||[]:[];
      const storedMeshEntry=tileKey?[...water?.surfaceAnimations?.values?.()||[]]
        .find(entry=>entry?.tileKeys?.has(tileKey)&&entry?.mesh&&!entry.mesh.isDisposed?.()):null;
      const localStoredWetAtPoint=!!pos&&standingPolygons.some(poly=>water?.pointInPolygon?.(pos,poly));
      const localCascades=[...water?.cascades?.entries?.()||[]].filter(([id])=>{
        const values=String(id).match(/-?\d+/g)?.map(Number)||[];
        return !!worldTile&&values.length===4&&(
          Math.abs(values[0]-worldTile.x)+Math.abs(values[1]-worldTile.y)<=1||
          Math.abs(values[2]-worldTile.x)+Math.abs(values[3]-worldTile.y)<=1);
      }).map(([id,entry])=>({
        id,storedWaterOvertopping:entry?.mesh?.metadata?.storedWaterOvertopping===true,
        edgeDischarge:Number(entry?.mesh?.metadata?.edgeDischarge||0),
        transportVolume:Number(entry?.mesh?.metadata?.transportVolume||0),
        hydrologyEdgeReason:entry?.mesh?.metadata?.hydrologyEdgeReason||null,
        receiverWet:entry?.mesh?.metadata?.receiverWet===true,
        hasStoredOvertoppingJunction:!!entry?.root?.getChildMeshes?.().some(m=>m.metadata?.kind==="water-cascade-junction")
      }));
      const hasStoredWaterDepthDiagnostic=t=>Number(t?.waterDepth||0)>hydrologyStorageThreshold;
      const waterfallEdgeInventory=[...water?.cascades?.entries?.()||[]].map(([id,entry])=>{
        const matched=/^(-?\d+),(-?\d+)->(-?\d+),(-?\d+)$/.exec(String(id));
        const upper=matched?lookup.get(`${matched[1]},${matched[2]}`):null;
        const lower=matched?lookup.get(`${matched[3]},${matched[4]}`):null;
        const flux=upper&&lower?hydrology?.edgeFlowState?.(upper,lower):null;
        const junction=water?.runoffs?.get(id);
        const networkEdge=water?.sheetFlowNetwork?.get(upper?`${upper.x},${upper.y}`:"")
          ?.outgoing?.find(e=>e.id===id);
        return{
          id,storedWaterOvertopping:entry?.mesh?.metadata?.storedWaterOvertopping===true,
          transportVolume:Number(entry?.mesh?.metadata?.transportVolume||0),
          edgeDischarge:Number(entry?.mesh?.metadata?.edgeDischarge||0),
          measuredRate:Number(flux?.solverRate||0),
          effectiveFlowRate:Number(flux?.rate||0),
          upperDepth:upper?Number(upper.waterDepth||0):null,
          lowerDepth:lower?Number(lower.waterDepth||0):null,
          upstreamStoredWetPolygons:upper&&hasStoredWaterDepthDiagnostic(upper)
            ?water?.waterSurfacePolygons?.(upper,lookup)?.length??0:0,
          downstreamStoredWetPolygons:lower&&hasStoredWaterDepthDiagnostic(lower)
            ?water?.waterSurfacePolygons?.(lower,lookup)?.length??0:0,
          hydrologyEdgeReason:entry?.mesh?.metadata?.hydrologyEdgeReason||null,
          receiverWet:entry?.mesh?.metadata?.receiverWet===true,
          runoffJunctionMeshPresent:!!junction&&!junction.isDisposed?.(),
          runoffJunctionKinds:junction?.metadata?.runoffSegments?.map(s=>s.kind)||[],
          networkRate:networkEdge?.q??0,
          networkRateKind:networkEdge?.qKind||null,
          storedOvertoppingJunctionPresent:!!entry?.root?.getChildMeshes?.().some(m=>m.metadata?.kind==="water-cascade-junction")
        };
      });
      const renderOwnership=tileKey?{
        tileKey,gameplayWaterDepth:Number(worldTile?.waterDepth||0),
        hydrologyStorageThreshold,storedWaterEligible,
        actualStoredMeshExists:!!storedMeshEntry,
        actualStoredMeshName:storedMeshEntry?.mesh?.name||null,
        storedWetPolygonAtClickedPoint:localStoredWetAtPoint,
        // Report the *actual* mesh/polygon ownership, not merely D>0.
        surfaceOwner:storedMeshEntry
          ?(localStoredWetAtPoint?'STORED_WET_AT_POINT':'STORED_SURFACE_OTHER_PART_OF_TILE')
          :sheetMesh?'Q_ONLY_TERRAIN_SHEET'
          :storedWaterEligible?'STORED_DEPTH_BUT_MESH_MISSING':'NO_RENDERED_SURFACE',
        localStoredWaterPolygons:standingPolygons.length,
        totalStoredSurfaceMeshes:water?.surfaceMeshes?.size??null,
        activeSheetFlowMeshes:water?.sheetFlowMeshes?.size??null,
        totalRunoffMeshes:runoffMeshes.length,
        legacyNonCascadeRunoffMeshes:legacyNonCascadeRunoffs.length,
        localLegacyRunoffMeshNames:localLegacyRunoffs.map(mesh=>mesh.name),
        remainingCliffJunctionRunoffs:runoffMeshes.filter(mesh=>mesh.metadata?.cascade===true).length,
        nearbyWaterfalls:localCascades
      }:null;
      // Sample the SAME polygons consumed by buildSheetFlow. A missing wet
      // polygon proves a dry/clipped point; it is not evidence of occlusion.
      const sampleSheet=()=>{
        if(!pos||!sheetSolution)return null;
        for(const polygon of sheetSolution.polygons||[]){
          const points=polygon.points||[];
          for(let i=1;i+1<points.length;i++){
            const a=points[0],b=points[i],c=points[i+1];
            const det=(b.x-a.x)*(c.z-a.z)-(c.x-a.x)*(b.z-a.z);
            if(Math.abs(det)<1e-12)continue;
            const u=((pos.x-a.x)*(c.z-a.z)-(pos.z-a.z)*(c.x-a.x))/det;
            const v=((pos.z-a.z)*(b.x-a.x)-(pos.x-a.x)*(b.z-a.z))/det;
            if(u< -1e-7||v< -1e-7||u+v>1+1e-7)continue;
            const depth=a.depth*(1-u-v)+b.depth*u+c.depth*v;
            const terrainY=a.y*(1-u-v)+b.y*u+c.y*v;
            return{triangleIndex:polygon.triangleIndex,visualFilmDepth:depth,
              terrainY,predictedWaterYWithoutRenderOffset:terrainY+depth,
              localWetPolygon:true};
          }
        }
        return{localWetPolygon:false,reason:"POINT_CLIPPED_OR_DRY"};
      };
      const nodeEdges=sheetNode?[...(sheetNode.incoming||[]),...(sheetNode.outgoing||[])]:[];
      const sheetFlowDiagnosis=tileKey?{
        tileKey,waterDepth:Number(worldTile?.waterDepth||0),
        sheetFlowMeshExists:!!sheetMesh&&!sheetMesh.isDisposed?.(),
        sheetFlowSolutionExists:!!sheetSolution,
        sheetStatus:storedWaterEligible?"STORED_WATER_EXCLUDED_FROM_Q_ONLY_SOLVER":
          sheetNode?.sheetStatus||"NO_NETWORK_NODE",
        sheetNetworkNodePresent:!!sheetNode,
        sheetNetworkNodeCount:water?.sheetFlowNetwork?.size??null,
        sheetRejectReason:sheetNode?.sheetRejectReason||null,
        sheetAcceptedEdges:sheetNode?.sheetAcceptedEdges||[],
        sheetRejectedEdges:sheetNode?.sheetRejectedEdges||[],
        boundaryEdges:nodeEdges.map(e=>({id:e.id,q:e.q,qKind:e.qKind||null,
          persistentRate:e.persistentRate??null,measuredRate:e.measuredRate??null,
          transportVolume:e.transportVolume,geometryJoinValid:e.geometryJoinValid,
          geometryJoin:e.geometryJoin,cascade:e.cascade})),
        sourceRate:sheetNode?.sourceRate??null,qIn:sheetNode?.qIn??null,qOut:sheetNode?.qOut??null,
        registeredTerrainTriangles:geom?.triangles?.length??null,
        wetTriangleCount:sheetSolution?.polygons?.length??0,
        sheetFlowWetArea:sheetSolution?.wetArea??null,
        sheetFlowCoreWetArea:sheetSolution?.coreWetArea??null,
        sheetFlowShoulderWetArea:sheetSolution?.shoulderWetArea??null,
        sheetFlowRegisteredProjectedArea:sheetSolution?.renderedProjectedArea??null,
        sheetFlowCoreProjectedArea:sheetSolution?.coreProjectedArea??null,
        sheetFlowShoulderProjectedArea:sheetSolution?.shoulderProjectedArea??null,
        sheetFlowNominalTileArea:sheetSolution?.nominalTileArea??null,
        renderedVolumeProxy:sheetSolution?.renderedVolumeProxy??null,
        volumeProxyBasis:sheetMesh?.metadata?.volumeProxyBasis??null,
        sheetFlowMaxDepth:sheetSolution?.maxDepth??null,
        actualMeshMaterialName:sheetMesh?.material?.name??null,
        actualMeshVertexAlphaMin:sheetMesh?.metadata?.minVertexAlpha??null,
        actualMeshVertexAlphaMax:sheetMesh?.metadata?.maxVertexAlpha??null,
        usingSharedWaterSurfaceMaterial:sheetMesh?.material===water?.surfaceMaterial,
        legacySourceRibbonMeshes:water?.sourceFootprints?.size??null,
        targetVolumeProxy:sheetSolution?.targetVolume??null,
        resolvedVolumeProxy:sheetSolution?.volumeProxyAfterSeam??null,
        localSurfaceSample:sampleSheet()
      }:null;
      const report={
        label:"Card Tactics 2 - Hydrology and Objective Click Diagnostics",
        seed:currentSeed,springMode:doc.getElementById("testLabSpring")?.value,
        meshName:mesh?.name||null,meshKind:metadata.kind||null,
        pickedTerrainMeshName:terrainHit?.hit?terrainHit.pickedMesh?.name:null,
        renderOwnership,
        objectiveDiagnostics,
        sheetFlow:sheetFlowDiagnosis,
        waterfallEdgeInventory,
        naturalRiverPoolAtTile:worldTile?.hydrologyNaturalChannelPool===true
          ?{bed:Number(worldTile.elevation||0),excavatedDepth:Number(worldTile.hydrologyNaturalChannelPoolDepth||0),
            storedD:Number(worldTile.waterDepth||0)}:null,
        environmentHistory:environmentHistory.slice(-10),
        liveWeather:runtime.debug?.state?.()||null,
        officialSystemLog:runtime.getBattleLog?.("SYSTEM")?.entries?.slice(-20)||[],
        officialDetailLog:runtime.getBattleLog?.("DETAIL")?.entries?.slice(-20)||[],
        visibleWaterMeshPicked:!!mesh,
        terrainOccludesWater:!!(waterHit?.hit&&terrainHit?.hit&&terrainHit.distance+0.0001<waterHit.distance),
        waterHitDistance:waterHit?.hit?waterHit.distance:null,
        actualWaterHitY:waterHit?.hit?waterHit.pickedPoint?.y??null:null,
        terrainHitDistance:terrainHit?.hit?terrainHit.distance:null,
        actualWaterHitHeightMinusTerrain:waterHit?.hit&&terrainHit?.hit
          ?Number(waterHit.pickedPoint.y)-Number(terrainHit.pickedPoint.y):null,
        terrainHitIsInspectionAnchor:true,
        worldPoint:pos?{x:pos.x,y:pos.y,z:pos.z}:null,
        renderedTerrainYAtPoint:measuredGroundY,
        waterHeightMinusTerrain:pos&&Number.isFinite(measuredGroundY)?pos.y-measuredGroundY:null,
        meshTriangleCount:mesh?.getTotalIndices?.()/3??null,
        meshVisibility:mesh?.visibility??null,
        meshAlphaIndex:mesh?.alphaIndex??null,
        material:material?{name:material.name,alpha:material.alpha??null,transparencyMode:material.transparencyMode??null,
          backFaceCulling:material.backFaceCulling,disableDepthWrite:material.disableDepthWrite,
          zOffset:material.zOffset}:null,
        meshMetadata:selectedMetadata,
        transportFootprint:flowFootprint,
        tile:tileSnapshot(worldTile,hydrology),
        edgeFrom:tileSnapshot(from,hydrology),edgeTo:tileSnapshot(to,hydrology),
        measuredEdgeFlow:edge?{flowing:edge.flowing,cascade:edge.cascade,sheetFlow:edge.sheetFlow,edgeDischarge:edge.edgeDischarge,transportVolume:edge.transportVolume,solverRate:edge.solverRate,surfaceDrop:edge.surfaceDrop,reason:edge.reason}:null,
        registeredSurfaceTriangles:geom?.triangles?.length??null,
        registeredCliff:cliff?{lip:cliff.lip,foot:cliff.foot,segments:cliff.segments?.length,drop:cliff.drop}:null,
        visualOnlyOvertopping:direction?!!surface?.storedWaterCliffOvertopping?.(from,to,direction):null
      };
      latestHydrologyLog=report;
      const panel=doc.getElementById("waterInspectPanel");panel.classList.add("open");
      doc.getElementById("testLabLogText").textContent=JSON.stringify(report,null,2);
      console.info("[Card Tactics Water Click]",report);
    }

    function installWaterInspection(win,doc,runtime){
      const overlay=ensureOverlay(doc),input=win.CardTacticsRenderer?.input,canvas=win.CardTacticsRenderer?.canvas;
      if(!input||!canvas)return;
      // Existing pointer gesture controller still handles panning/pinch, and
      // the test-only selection replaces its tile action with diagnostics.
      let inspectEnabled=true,start=null;
      input.onTilePicked=()=>{};
      overlay.inspect.onclick=()=>{
        inspectEnabled=!inspectEnabled;
        overlay.inspect.textContent=`點選診斷：${inspectEnabled?"開":"關"}`;
        overlay.inspect.classList.toggle("inspection-on",inspectEnabled);
        overlay.inspect.setAttribute("aria-pressed",String(inspectEnabled));
      };
      canvas.addEventListener("pointerdown",event=>{start={id:event.pointerId,x:event.clientX,y:event.clientY};});
      canvas.addEventListener("pointercancel",()=>{start=null;});
      canvas.addEventListener("pointerup",event=>{
        if(!start||start.id!==event.pointerId)return;
        const moved=Math.hypot(start.x-event.clientX,start.y-event.clientY);start=null;
        if(inspectEnabled&&moved<=(event.pointerType==="touch"?12:6))inspectWaterAt(win,doc,runtime,event.clientX,event.clientY);
      });
      doc.getElementById("testLabCloseLog").onclick=()=>overlay.panel.classList.remove("open");
      doc.getElementById("testLabCopyLog").onclick=async()=>{
        if(!latestHydrologyLog)return;
        const content=JSON.stringify(latestHydrologyLog,null,2);
        try{
          await navigator.clipboard.writeText(content);
          doc.getElementById("testLabCopyLog").textContent="已複製";
        }catch(error){
          const area=doc.createElement("textarea");area.value=content;area.style.position="fixed";area.style.left="-9999px";
          doc.body.appendChild(area);area.select();doc.execCommand("copy");area.remove();
          doc.getElementById("testLabCopyLog").textContent="已複製";
        }
      };
    }

    frame.addEventListener("load",async()=>{
      try{
        const win=frame.contentWindow,doc=frame.contentDocument;
        await waitFor(()=>win.CardTacticsRuntime&&win.CardTacticsRenderer&&win.MapGenerator&&win.BABYLON);
        injectTestStyle(doc);const overlay=ensureOverlay(doc);
        overlay.refresh.onclick=()=>generateTestMap(win,doc,{reuseSeed:false});
        overlay.stressQuick.onclick=()=>{controlsCollapsed=false;ensureOverlay(doc);if(!overlay.weatherPanel.classList.contains("open"))overlay.weatherToggle.click();runStressLab(win,doc,win.CardTacticsRuntime);};
        overlay.stressRun.onclick=()=>runStressLab(win,doc,win.CardTacticsRuntime);
        overlay.stressStop.onclick=()=>{stressStopRequested=true;refreshStressPreview(doc,"正在停止，會完成當前環境步驟");};
        overlay.stressCopy.onclick=()=>copyStressLab(doc,win.CardTacticsRuntime);
        overlay.stressSave.onclick=()=>saveStressLab(win.CardTacticsRuntime);
        overlay.stressClear.onclick=()=>{if(stressRunning)return;stressRecords=[];stressCurrentStep=0;persistStress();refreshStressPreview(doc,"已清除");};
        overlay.applyDayNight.onclick=()=>applyDayNightInLab(win,doc,win.CardTacticsRuntime);
        win.addEventListener("error",event=>stressLog("GAME_ERROR",{message:String(event.message||"error").slice(0,400)}));
        win.addEventListener("unhandledrejection",event=>stressLog("GAME_REJECTION",{message:String(event.reason?.message||event.reason||"unknown").slice(0,400)}));
        win.CardTacticsRenderer?.canvas?.addEventListener("webglcontextlost",event=>stressLog("WEBGL_CONTEXT_LOST",{message:"WebGL context lost",step:stressCurrentStep}));
        refreshStressPreview(doc);
        overlay.rebuild.onclick=()=>generateTestMap(win,doc,{reuseSeed:true});
        overlay.seed.onkeydown=event=>{if(event.key==="Enter")generateTestMap(win,doc,{reuseSeed:true});};
        overlay.spring.onchange=()=>generateTestMap(win,doc,{reuseSeed:true});
        overlay.weatherToggle.onclick=()=>{
          const isOpen=overlay.weatherPanel.classList.toggle("open");
          overlay.weatherToggle.setAttribute("aria-expanded",String(isOpen));
          if(isOpen){
            // Mobile toolbar wraps into several rows; dock the climate controls
            // below its ACTUAL bounding rect, never on top of the seed buttons.
            const y=Math.max(8,overlay.toolbar.getBoundingClientRect().bottom-doc.getElementById("battleScreen").getBoundingClientRect().top+8);
            overlay.weatherPanel.style.top=`${y}px`;
            overlay.weatherPanel.style.maxHeight=`${Math.max(175,win.innerHeight-y-16)}px`;
          }
          refreshWeatherPanel(win,doc,win.CardTacticsRuntime);
        };
        overlay.applyWeather.onclick=()=>applyWeatherInLab(win,doc,win.CardTacticsRuntime);
        overlay.applyWind.onclick=()=>applyWindInLab(win,doc,win.CardTacticsRuntime);
        overlay.advanceOne.onclick=()=>advanceWeatherInLab(win,doc,win.CardTacticsRuntime,1);
        overlay.advanceFive.onclick=()=>advanceWeatherInLab(win,doc,win.CardTacticsRuntime,5);
        overlay.copyTimeline.onclick=async()=>{
          const report={label:"Card Tactics 2 - Environment/Hydrology Timeline",seed:currentSeed,history:environmentHistory,
            latestGameSystemLog:win.CardTacticsRuntime.getBattleLog?.("SYSTEM")?.entries||[],
            latestGameDetailLog:win.CardTacticsRuntime.getBattleLog?.("DETAIL")?.entries||[]};
          const content=JSON.stringify(report,null,2);
          try{await navigator.clipboard.writeText(content);}
          catch(_){const t=doc.createElement("textarea");t.value=content;t.style.position="fixed";t.style.left="-9999px";doc.body.appendChild(t);t.select();doc.execCommand("copy");t.remove();}
          overlay.copyTimeline.textContent="已複製";
        };
        installWaterInspection(win,doc,win.CardTacticsRuntime);
        await generateTestMap(win,doc,{reuseSeed:false});
        startMarkerLoop(win,doc,win.CardTacticsRuntime);
        boot.classList.add("hidden");
      }catch(error){
        console.error(error);boot.textContent=`Test Lab 啟動失敗｜${error?.message||error}`;
      }
    });
  </script>
</body>
</html>
